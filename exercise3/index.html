<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <h1>Tic-Tac-Toe</h1>

        <div class="scoreboard">

            <div>
                <p>Player X</p>
                <h2 id="xWins">0</h2>
            </div>

            <div>
                <p>Draws</p>
                <h2 id="draws">0</h2>
            </div>

            <div>
                <p>Player O</p>
                <h2 id="oWins">0</h2>
            </div>

        </div>

        <h3 id="status">Player X's turn</h3>

        <div id="board" class="board"></div>

        <button id="newRound">↻ New Round</button>

    </main>

    <script src="app.js"></script>

</body>
</html>
